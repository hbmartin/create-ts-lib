name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.5.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm run lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm publint --pack npm
      - run: pnpm attw --pack . --profile esm-only
      - run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  generated-project-smoke:
    name: Smoke test generated project
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include-cli: [false, true]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.5.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate project
        env:
          SMOKE_DIR: ${{ runner.temp }}/e2e-pnpm-${{ matrix.include-cli }}
          SMOKE_INCLUDE_CLI: ${{ matrix.include-cli }}
          SMOKE_PACKAGE_MANAGER: pnpm
        run: node scripts/smoke-test-scaffold.mjs
      - run: git init
        working-directory: ${{ runner.temp }}/e2e-pnpm-${{ matrix.include-cli }}
      - name: Install generated project dependencies
        run: |
          pnpm install
          test -f pnpm-lock.yaml
          ! git check-ignore -q pnpm-lock.yaml
          rm -rf node_modules
          pnpm install --frozen-lockfile
        working-directory: ${{ runner.temp }}/e2e-pnpm-${{ matrix.include-cli }}
      - run: pnpm run lint
        working-directory: ${{ runner.temp }}/e2e-pnpm-${{ matrix.include-cli }}
      - run: pnpm run build
        working-directory: ${{ runner.temp }}/e2e-pnpm-${{ matrix.include-cli }}
      - name: Run generated project publint
        run: pnpm exec publint --pack npm
        working-directory: ${{ runner.temp }}/e2e-pnpm-${{ matrix.include-cli }}
      - run: pnpm run test
        working-directory: ${{ runner.temp }}/e2e-pnpm-${{ matrix.include-cli }}
