name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.5.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm run check
        env:
          SECURITY_LINT_FORCE_UVX: "1"
      - name: TypeScript 7 compatibility probe
        run: pnpm --package @typescript/native-preview@7.0.0-dev.20260421.2 dlx tsgo -p tsconfig.typecheck.json --noEmit
      - run: pnpm run build
      - run: pnpm run publint
      - run: pnpm run types:lint

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  generated-project-smoke:
    name: Smoke test generated project
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include-cli: [false, true]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.5.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Smoke test generated project
        env:
          SMOKE_DIR: ${{ runner.temp }}/e2e-pnpm-${{ matrix.include-cli }}
          SMOKE_INCLUDE_CLI: ${{ matrix.include-cli }}
          SMOKE_PACKAGE_MANAGER: pnpm
        run: pnpm run smoke:scaffold
