name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm run check
        env:
          SECURITY_LINT_FORCE_UVX: "1"
      - run: pnpm run build
      - run: pnpm run publint
      - run: pnpm run types:lint

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  generated-project-smoke:
    name: Smoke test generated project (Node ${{ matrix.node-version }}, CLI ${{ matrix.include-cli }}, ${{ matrix.lint-format }}, ${{ matrix.bundler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
        include-cli: [false, true]
        lint-format: ["oxlint-oxfmt"]
        bundler: ["tsc"]
        include:
          - node-version: "24"
            include-cli: false
            lint-format: "biome"
            bundler: "tsc"
          - node-version: "24"
            include-cli: true
            lint-format: "biome"
            bundler: "tsc"
          - node-version: "24"
            include-cli: true
            lint-format: "oxlint-oxfmt"
            bundler: "tsdown"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Smoke test generated project
        env:
          SMOKE_BUNDLER: ${{ matrix.bundler }}
          SMOKE_DIR: ${{ runner.temp }}/e2e-node-${{ matrix.node-version }}-cli-${{ matrix.include-cli }}-${{ matrix.lint-format }}-${{ matrix.bundler }}
          SMOKE_INCLUDE_CLI: ${{ matrix.include-cli }}
          SMOKE_LINT_FORMAT: ${{ matrix.lint-format }}
          # Scaffold for the same major the runner is on, so each leg installs
          # that target's @types/node and typechecks a real project against it.
          SMOKE_NODE_TARGET: ${{ matrix.node-version }}
          SMOKE_PACKAGE_MANAGER: pnpm
        run: pnpm run smoke:scaffold
